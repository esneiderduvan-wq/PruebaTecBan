version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brp-postgres
    environment:
      POSTGRES_USER: brp_user
      POSTGRES_PASSWORD: brp_password
      POSTGRES_DB: brp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/files:/app/adjuntos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brp_user -d brp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: